name: Netatmo

on:
  workflow_dispatch:

permissions:                                  # NOUVEAU : autorise le workflow à pousser des fichiers
  contents: write

concurrency:                                  # NOUVEAU : jamais deux lancements en même temps
  group: netatmo

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: python main.py 2026-11-01 2026-11-27

      # NOUVEAU : enregistre le nouveau refresh token Netatmo dans les secrets
      - name: Mettre à jour le refresh token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -s new_refresh_token.txt ]; then
            gh secret set REFRESH_TOKEN --repo "${{ github.repository }}" < new_refresh_token.txt
            rm new_refresh_token.txt
            echo "secret REFRESH_TOKEN mis à jour"
          fi

      # NOUVEAU : committe les CSV du dossier data/ dans le dépôt
      - name: Enregistrer les données dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "rien de nouveau" && exit 0
          git commit -m "Données Netatmo du $(date -u +%Y-%m-%d)"
          git push
