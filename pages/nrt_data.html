<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Météo temps réel</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #101820;
    color: white;
    text-align: center;
}

.dashboard {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 30px;
    margin-top: 40px;
}

.gauge {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: conic-gradient(#00c2ff calc(var(--value) * 1%), #263544 0);
}

.gauge-inner {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: #101820;
    display: grid;
    place-items: center;
}

.value {
    font-size: 28px;
    font-weight: bold;
}

.label {
    margin-top: 10px;
    font-size: 18px;
}
</style>
</head>
<body>

<h1>Météo actuelle</h1>

<div class="dashboard">

    <div>
        <div class="gauge" style="--value: 99">
            <div class="gauge-inner">
                <div class="value">32°C</div>
            </div>
        </div>
        <div class="label">Température</div>
    </div>

    <div>
        <div class="gauge" style="--value: 25">
            <div class="gauge-inner">
                <div class="value">25%</div>
            </div>
        </div>
        <div class="label">Humidité</div>
    </div>

    <div>
        <div class="gauge" style="--value: 5">
            <div class="gauge-inner">
                <div class="value">5</div>
            </div>
        </div>
        <div class="label">Vent km/h</div>
    </div>

    <div>
        <div class="gauge" style="--value: 0">
            <div class="gauge-inner">
                <div class="value">0</div>
            </div>
        </div>
        <div class="label">Pluie mm</div>
    </div>

</div>

</body>
</html>
